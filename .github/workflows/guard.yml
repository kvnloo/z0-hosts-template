name: guard

# Runs in the template and in every private copy made from it:
# schema + leak patterns (scripts/validate.py) and a pinned, checksum-verified gitleaks.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
      GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Schema and leak patterns
        run: python3 scripts/validate.py
      - name: Validator tests
        run: python3 -m unittest scripts/test_validate.py -v
      - name: Install gitleaks (sha256-pinned)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks (working tree and history)
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --no-banner --redact
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact
